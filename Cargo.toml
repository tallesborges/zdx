[workspace]
members = [
    "crates/zdx-cli",
    "crates/xtask",
    "crates/zdx-assets",
    "crates/zdx-types",
    "crates/zdx-engine",
    "crates/zdx-providers",
    "crates/zdx-tools",
]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Too noisy / stylistic preference:
module_name_repetitions = "allow"
must_use_candidate = "allow"
absolute_paths = "warn"
multiple_crate_versions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# Restriction lints (opt-in):
map_err_ignore = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
clone_on_ref_ptr = "warn"
rest_pat_in_fully_bound_structs = "warn"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22"
bytes = "1.11.0"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
ctrlc = "3.4"
futures-util = "0.3.31"
eventsource-stream = "0.2"
zdx-assets = { path = "crates/zdx-assets" }
zdx-providers = { path = "crates/zdx-providers" }
zdx-tools = { path = "crates/zdx-tools" }
zdx-types = { path = "crates/zdx-types" }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"
ignore = "0.4"
infer = "0.19"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
minijinja = "2.15.1"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2", "charset"] }
rmcp = { version = "1.2.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "=3.24.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "process", "macros", "sync"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }
toml = "0.8"
toml_edit = "0.22"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.19.0", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
codegen-units = 256

[profile.dev.package."*"]
debug = 0

# Release builds of the engine and the CLI crate run at opt-level 1: no runtime
# cost was measured (thread reindex, stats, search, exec). At opt-level 0-1 rustc
# shares generic instantiations between crates, so the CLI crate reuses the
# engine's instead of compiling its own; that halves the CLI step.
[profile.release.package.zdx-engine]
opt-level = 1

[profile.release.package.zdx]
opt-level = 1
