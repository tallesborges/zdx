name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Override the repo's .cargo/config.toml target-dir and lld linker so
      # the binary lands in ./target and links with the default toolchain.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
          # Linux baseline: glibc 2.35 (Ubuntu 22.04; Debian 12 has 2.36).
          # The binary links against the builder's glibc, so the builder pins
          # the baseline. It must not link ALSA (libasound.so.2).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            features: ""
            glibc_max: "2.35"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build -p zdx --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Check Linux baseline
        if: runner.os == 'Linux'
        run: |
          bin=target/${{ matrix.target }}/release/zdx
          readelf -d "$bin" | grep NEEDED
          if readelf -d "$bin" | grep -q libasound; then
            echo "::error::zdx links libasound"; exit 1
          fi
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Highest glibc symbol version: $need (baseline ${{ matrix.glibc_max }})"
          if [ "$(printf '%s\n%s\n' "$need" "${{ matrix.glibc_max }}" | sort -V | tail -1)" != "${{ matrix.glibc_max }}" ]; then
            echo "::error::zdx needs glibc $need, above the ${{ matrix.glibc_max }} baseline"; exit 1
          fi
          "$bin" --version

      - name: Package
        run: tar -czf zdx-${{ inputs.tag }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release zdx

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zdx-${{ matrix.target }}
          path: zdx-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish release ${{ inputs.tag }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/*.tar.gz \
            --title "${{ inputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }}
