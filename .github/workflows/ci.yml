name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  checks:
    name: format + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changed]
    if: needs.changed.outputs.code_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy

      - name: Install nightly (for fmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +nightly fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build -p zdx --locked

      - name: Test
        run: cargo test --workspace --lib --tests --bins --locked

  go:
    name: Go module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changed]
    if: needs.changed.outputs.code_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Go version comes from the module's own go.mod (toolchain directive).
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/go.mod
          cache-dependency-path: apps/go.sum

      # Every package is formatted, vetted, and compiled (zdx-go without the
      # Mini App); the race tests cover the shared packages and the entry
      # point. The gateway, monitor, and TUI tests run only locally.
      - name: Format, vet, build, race tests
        working-directory: apps
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build -o /dev/null ./cmd/zdx-go
          go test -race ./shared/... ./cmd/...

  results:
    name: results
    runs-on: ubuntu-latest
    needs: [changed, checks, go]
    if: always()
    steps:
      - name: Verify results
        run: |
          echo "code_changed: ${{ needs.changed.outputs.code_changed }}"
          echo "checks result: ${{ needs.checks.result }}"
          echo "go result: ${{ needs.go.result }}"
          if [ "${{ needs.changed.outputs.code_changed }}" != "true" ]; then
            echo "Docs-only change; skipping checks."
            exit 0
          fi
          if [ "${{ needs.checks.result }}" != "success" ]; then
            exit 1
          fi
          if [ "${{ needs.go.result }}" != "success" ]; then
            exit 1
          fi