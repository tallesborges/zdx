<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>ZDX Monitor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0b0d0c);
      --panel: var(--tg-theme-secondary-bg-color, #141715);
      --panel-strong: #1a1e1b;
      --text: var(--tg-theme-text-color, #f2f5ef);
      --muted: var(--tg-theme-hint-color, #8e978f);
      --line: color-mix(in srgb, var(--text) 12%, transparent);
      --accent: #b8f34a;
      --cyan: #6ee7e0;
      --amber: #f6c85f;
      --red: #ff756d;
      --sans: "Manrope", sans-serif;
      --mono: "Azeret Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(rgba(184, 243, 74, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184, 243, 74, 0.028) 1px, transparent 1px),
        radial-gradient(circle at 85% -5%, rgba(110, 231, 224, 0.11), transparent 35%),
        var(--bg);
      background-size: 28px 28px, 28px 28px, auto, auto;
      font-family: var(--sans);
      padding: env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .shell {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 14px;
      margin-bottom: 18px;
      animation: rise 420ms ease-out both;
    }

    .overline,
    .section-kicker,
    .metric-label,
    .row-meta,
    .stamp,
    .status-chip,
    .config-key,
    .nav-item {
      font-family: var(--mono);
      letter-spacing: 0.055em;
    }

    .overline {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 8vw, 44px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    .refresh {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      color: var(--text);
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .refresh:active {
      transform: scale(0.92);
    }

    .refresh.loading svg {
      animation: spin 700ms linear infinite;
    }

    .refresh svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .system-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--panel-strong) 96%, transparent), color-mix(in srgb, var(--panel) 88%, transparent));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
      animation: rise 460ms 40ms ease-out both;
    }

    .system-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -92px;
      top: -108px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 50%;
      box-shadow: 0 0 0 22px rgba(184, 243, 74, 0.025), 0 0 0 44px rgba(184, 243, 74, 0.018);
    }

    .system-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .system-state {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .pulse {
      position: relative;
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(184, 243, 74, 0.1);
    }

    .pulse::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 1px solid var(--accent);
      border-radius: inherit;
      animation: pulse 2.2s ease-out infinite;
    }

    .system-card.attention .pulse {
      background: var(--amber);
      box-shadow: 0 0 0 5px rgba(246, 200, 95, 0.1);
    }

    .system-card.attention .pulse::after {
      border-color: var(--amber);
    }

    .system-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .stamp {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--line);
    }

    .metric {
      min-width: 0;
      padding: 14px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
    }

    .metric-value {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-label {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .section {
      margin-top: 28px;
      animation: rise 500ms ease-out both;
    }

    .section:nth-of-type(2) { animation-delay: 80ms; }
    .section:nth-of-type(3) { animation-delay: 120ms; }
    .section:nth-of-type(4) { animation-delay: 160ms; }
    .section:nth-of-type(5) { animation-delay: 200ms; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
      padding: 0 2px;
    }

    .section-kicker {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.035em;
    }

    .section-count {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
    }

    .list-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 12px 14px;
      color: inherit;
      text-align: left;
      text-decoration: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      width: 100%;
    }

    .list-row:last-child {
      border-bottom: 0;
    }

    button.list-row {
      cursor: pointer;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.running { background: var(--accent); box-shadow: 0 0 12px rgba(184, 243, 74, 0.55); }
    .status-dot.active { background: var(--cyan); box-shadow: 0 0 12px rgba(110, 231, 224, 0.5); }
    .status-dot.stopped { background: var(--red); }

    .row-main {
      min-width: 0;
    }

    .row-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-detail {
      overflow: hidden;
      margin-top: 4px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-meta {
      color: var(--muted);
      font-size: 9px;
      text-align: right;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 7px;
      color: var(--muted);
      font-size: 8px;
      text-transform: uppercase;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .status-chip.good {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
      background: color-mix(in srgb, var(--accent) 7%, transparent);
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      text-align: center;
    }

    .subscription-card {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .subscription-card:last-child {
      border-bottom: 0;
    }

    .subscription-head,
    .quota-head,
    .quota-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .subscription-name {
      overflow: hidden;
      font-size: 14px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .plan-chip {
      flex: 0 0 auto;
      padding: 4px 7px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 8px;
      text-transform: uppercase;
      border: 1px solid color-mix(in srgb, var(--cyan) 28%, transparent);
      border-radius: 6px;
      background: color-mix(in srgb, var(--cyan) 7%, transparent);
    }

    .quota-window {
      margin-top: 15px;
    }

    .quota-label,
    .quota-value,
    .quota-foot {
      font-family: var(--mono);
      font-size: 9px;
    }

    .quota-label {
      min-width: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .quota-scope {
      color: var(--muted);
      font-weight: 400;
      text-transform: none;
    }

    .quota-value {
      flex: 0 0 auto;
      color: var(--accent);
      font-weight: 700;
    }

    .quota-value.warning { color: var(--amber); }
    .quota-value.danger { color: var(--red); }

    .quota-track {
      height: 7px;
      overflow: hidden;
      margin-top: 8px;
      border-radius: 999px;
      background: var(--line);
    }

    .quota-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 420ms ease-out;
    }

    .quota-fill.warning { background: var(--amber); }
    .quota-fill.danger { background: var(--red); }

    .quota-foot {
      margin-top: 7px;
      color: var(--muted);
    }

    .subscription-error {
      margin-top: 12px;
      color: var(--amber);
      font-family: var(--mono);
      font-size: 9px;
    }

    .usage-panel {
      padding: 16px;
    }

    .chart {
      height: 112px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      padding: 8px 2px 0;
      border-bottom: 1px solid var(--line);
    }

    .bar {
      min-width: 2px;
      flex: 1 1 0;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(to top, color-mix(in srgb, var(--cyan) 55%, transparent), var(--cyan));
      opacity: 0.85;
      transform-origin: bottom;
      animation: grow 520ms ease-out both;
    }

    .usage-breakdown {
      display: grid;
      gap: 13px;
      margin-top: 18px;
    }

    .usage-line-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-family: var(--mono);
      font-size: 9px;
    }

    .usage-line-head span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .usage-line-head span:last-child {
      color: var(--muted);
      white-space: nowrap;
    }

    .track {
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .track-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .config-cell {
      min-width: 0;
      padding: 14px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .config-cell:nth-child(2n) { border-right: 0; }
    .config-cell:nth-last-child(-n + 2) { border-bottom: 0; }

    .config-key {
      color: var(--muted);
      font-size: 8px;
      text-transform: uppercase;
    }

    .config-value {
      overflow: hidden;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .helper-list {
      border-top: 1px solid var(--line);
    }

    .read-only {
      margin: 22px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.6;
      text-align: center;
    }

    .error-panel {
      margin-top: 22vh;
      padding: 28px 20px;
      text-align: center;
      border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
      border-radius: 18px;
      background: color-mix(in srgb, var(--red) 5%, var(--panel));
    }

    .error-panel h2 { color: var(--red); }
    .error-panel p { color: var(--muted); font-size: 13px; line-height: 1.55; }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(300px, calc(100% - 32px));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--panel-strong) 90%, transparent);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    .nav-item {
      padding: 11px 12px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 9px;
    }

    .nav-item.active {
      color: #10130e;
      background: var(--accent);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { opacity: 0.65; transform: scale(0.55); } to { opacity: 0; transform: scale(1.45); } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    @media (min-width: 560px) {
      .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .metric + .metric { border-left: 0; }
      .config-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .config-cell:nth-child(2n) { border-right: 1px solid var(--line); }
      .config-cell:nth-child(4n) { border-right: 0; }
      .config-cell { border-bottom: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell" id="app">
    <header class="masthead">
      <div>
        <p class="overline">Local operations</p>
        <h1>ZDX Monitor</h1>
      </div>
      <button class="refresh" id="refreshButton" type="button" aria-label="Refresh monitor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.6-2.6L20 9M4 15l2.3 2.6A7 7 0 0 0 17.9 15" /></svg>
      </button>
    </header>

    <section class="system-card" id="systemCard">
      <div class="system-top">
        <div class="system-state">
          <span class="pulse"></span>
          <p class="system-title" id="systemTitle">Reading local state…</p>
        </div>
        <span class="stamp" id="updatedAt">SYNCING</span>
      </div>
      <div class="metrics" id="metrics"></div>
    </section>

    <div id="content"></div>
    <p class="read-only">READ ONLY · SERVICE CONTROL AND RESTARTS STAY MANUAL</p>
  </main>

  <nav class="bottom-nav" aria-label="Mini App sections">
    <a class="nav-item active" href="/monitor">Monitor</a>
    <a class="nav-item" href="/threads">Threads</a>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.("secondary_bg_color");
      tg.setBackgroundColor?.("bg_color");
    }

    const app = document.getElementById("app");
    const content = document.getElementById("content");
    const refreshButton = document.getElementById("refreshButton");
    let lastLoadedAt = 0;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function compact(value) {
      const number = Number(value || 0);
      if (number >= 1e9) return `${(number / 1e9).toFixed(1)}B`;
      if (number >= 1e6) return `${(number / 1e6).toFixed(1)}M`;
      if (number >= 1e3) return `${(number / 1e3).toFixed(1)}k`;
      return number.toLocaleString();
    }

    function money(value) {
      return `$${Number(value || 0).toFixed(2)}`;
    }

    function shortId(value) {
      if (!value) return "no thread";
      return value.length > 14 ? `${value.slice(0, 8)}…${value.slice(-4)}` : value;
    }

    function section(kicker, title, count) {
      const wrapper = element("section", "section");
      const head = element("div", "section-head");
      const titles = element("div");
      titles.append(element("p", "section-kicker", kicker), element("h2", "", title));
      head.append(titles, element("span", "section-count", count));
      wrapper.append(head);
      return wrapper;
    }

    function emptyPanel(message) {
      const panel = element("div", "panel");
      panel.append(element("div", "empty", message));
      return panel;
    }

    function listRow({ tone = "", title, detail, meta, onClick }) {
      const row = element(onClick ? "button" : "div", "list-row");
      if (onClick) {
        row.type = "button";
        row.addEventListener("click", onClick);
      }
      const dot = element("span", `status-dot ${tone}`);
      const main = element("div", "row-main");
      main.append(element("div", "row-title", title), element("div", "row-detail", detail));
      row.append(dot, main, element("div", "row-meta", meta));
      return row;
    }

    function renderMetrics(data) {
      const usage = data.usage;
      const quotaWindows = (data.subscriptions || []).flatMap(subscription => subscription.windows || []);
      const highestQuota = quotaWindows.length
        ? Math.max(...quotaWindows.map(window => Number(window.used_percent || 0)))
        : null;
      const values = [
        [data.services.filter(service => service.running).length, "services online"],
        [data.active_agents.length, "active agents"],
        [highestQuota === null ? "—" : `${Math.round(highestQuota)}%`, "highest quota"],
        [usage ? compact(usage.tokens) : "—", "tokens · 30d"],
      ];
      const metrics = document.getElementById("metrics");
      metrics.replaceChildren(...values.map(([value, label]) => {
        const metric = element("div", "metric");
        metric.append(element("span", "metric-value", String(value)), element("span", "metric-label", label));
        return metric;
      }));
    }

    function renderServices(data) {
      const wrapper = section("01 / Runtime", "Services", `${data.services.length} managed`);
      const panel = element("div", "panel");
      for (const service of data.services) {
        const detail = service.running
          ? `PID ${service.pid ?? "—"} · UP ${service.uptime || "—"}`
          : service.installed ? "LAUNCHD · STOPPED" : "NOT INSTALLED";
        const chip = element("span", `status-chip ${service.running ? "good" : ""}`, service.running ? "online" : "offline");
        const row = element("div", "list-row");
        row.append(element("span", `status-dot ${service.running ? "running" : "stopped"}`));
        const main = element("div", "row-main");
        main.append(element("div", "row-title", service.name), element("div", "row-detail", detail));
        row.append(main, chip);
        panel.append(row);
      }
      wrapper.append(panel);
      return wrapper;
    }

    function renderAgents(data) {
      const wrapper = section("02 / Activity", "Agent runs", `${data.active_agents.length} live`);
      if (!data.active_agents.length) {
        wrapper.append(emptyPanel("NO ACTIVE AGENT RUNS"));
        return wrapper;
      }
      const panel = element("div", "panel");
      for (const agent of data.active_agents) {
        const provider = [agent.provider, agent.account].filter(Boolean).join("@");
        const model = [provider, agent.model].filter(Boolean).join(":") || "model unavailable";
        const role = agent.role || agent.surface || "agent";
        const detail = `${model}${agent.thinking ? ` @${agent.thinking}` : ""} · ${shortId(agent.thread_id)}`;
        const open = agent.thread_id
          ? () => { window.location.href = `/threads?id=${encodeURIComponent(agent.thread_id)}`; }
          : undefined;
        panel.append(listRow({ tone: "active", title: role, detail, meta: `PID ${agent.pid}\n${agent.uptime || "—"}`, onClick: open }));
      }
      wrapper.append(panel);
      return wrapper;
    }

    function renderBackground(data) {
      const wrapper = section("03 / Detached", "Background", `${data.background_processes.length} running`);
      if (!data.background_processes.length) {
        wrapper.append(emptyPanel("NO BACKGROUND PROCESSES"));
        return wrapper;
      }
      const panel = element("div", "panel");
      for (const process of data.background_processes) {
        const row = listRow({
          tone: "active",
          title: process.command,
          detail: `${process.id} · ${shortId(process.thread_id)}`,
          meta: `PID ${process.pid}\n${process.uptime || "—"}`,
        });
        row.title = process.command;
        panel.append(row);
      }
      wrapper.append(panel);
      return wrapper;
    }

    function quotaTone(percent) {
      if (percent >= 90) return "danger";
      if (percent >= 75) return "warning";
      return "";
    }

    function resetLabel(value) {
      if (!value) return "reset unknown";
      const seconds = Math.floor((new Date(value).getTime() - Date.now()) / 1000);
      if (!Number.isFinite(seconds) || seconds <= 0) return "reset due";
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (days > 0) return `resets in ${days}d ${hours}h`;
      if (hours > 0) return `resets in ${hours}h ${minutes}m`;
      return `resets in ${minutes}m`;
    }

    function renderSubscriptions(data) {
      const subscriptions = data.subscriptions || [];
      const wrapper = section("04 / Live limits", "Subscriptions", `${subscriptions.length} account${subscriptions.length === 1 ? "" : "s"}`);
      if (!subscriptions.length) {
        wrapper.append(emptyPanel("NO SUPPORTED SUBSCRIPTIONS LOGGED IN"));
        return wrapper;
      }

      const panel = element("div", "panel");
      for (const subscription of subscriptions) {
        const card = element("div", "subscription-card");
        const head = element("div", "subscription-head");
        head.append(element("div", "subscription-name", subscription.name));
        if (subscription.plan) head.append(element("span", "plan-chip", subscription.plan));
        card.append(head);

        if (subscription.error) {
          card.append(element("div", "subscription-error", subscription.error.toUpperCase()));
        } else if (!subscription.windows.length) {
          card.append(element("div", "subscription-error", "QUOTA WINDOWS UNAVAILABLE"));
        }

        for (const window of subscription.windows) {
          const percent = Math.max(0, Math.min(100, Number(window.used_percent || 0)));
          const tone = quotaTone(percent);
          const quota = element("div", "quota-window");
          const quotaHead = element("div", "quota-head");
          const label = element("span", "quota-label", window.label);
          if (window.scope) label.append(element("span", "quota-scope", ` · ${window.scope}`));
          quotaHead.append(label, element("span", `quota-value ${tone}`, `${Math.round(percent)}% used`));

          const track = element("div", "quota-track");
          const fill = element("div", `quota-fill ${tone}`);
          fill.style.width = `${percent}%`;
          track.append(fill);

          const foot = element("div", "quota-foot");
          foot.append(element("span", "", `${Math.round(100 - percent)}% remaining`), element("span", "", resetLabel(window.resets_at)));
          quota.append(quotaHead, track, foot);
          card.append(quota);
        }
        panel.append(card);
      }
      wrapper.append(panel);
      return wrapper;
    }

    function renderUsage(data) {
      const usage = data.usage;
      const wrapper = section("05 / Consumption", "Usage", usage ? `${usage.threads_scanned} threads · ${usage.span}` : "unavailable");
      if (!usage) {
        wrapper.append(emptyPanel("USAGE AGGREGATION UNAVAILABLE"));
        return wrapper;
      }
      const panel = element("div", "panel usage-panel");
      const chart = element("div", "chart");
      const peak = Math.max(1, ...usage.daily.map(day => day.tokens));
      for (const day of usage.daily) {
        const bar = element("div", "bar");
        bar.style.height = `${Math.max(2, (day.tokens / peak) * 100)}%`;
        bar.title = `${new Date(day.day * 86400000).toLocaleDateString()} · ${compact(day.tokens)} tokens`;
        chart.append(bar);
      }
      if (!usage.daily.length) chart.append(element("div", "empty", "NO DATED USAGE"));
      panel.append(chart);

      const breakdown = element("div", "usage-breakdown");
      const providerPeak = Math.max(1, ...usage.by_provider.map(row => row.tokens));
      for (const row of usage.by_provider.slice(0, 6)) {
        const item = element("div");
        const head = element("div", "usage-line-head");
        head.append(
          element("span", "", row.provider + (row.estimated ? " *" : "")),
          element("span", "", `${compact(row.tokens)} · ${row.subscription ? "subscription" : money(row.cost_usd)}`),
        );
        const track = element("div", "track");
        const fill = element("div", "track-fill");
        fill.style.width = `${(row.tokens / providerPeak) * 100}%`;
        track.append(fill);
        item.append(head, track);
        breakdown.append(item);
      }
      panel.append(breakdown);
      wrapper.append(panel);
      return wrapper;
    }

    function renderConfig(data) {
      const config = data.config;
      const wrapper = section("06 / Effective", "Configuration", "safe summary");
      const panel = element("div", "panel");
      const grid = element("div", "config-grid");
      const entries = [
        ["Model", config.model],
        ["Thinking", config.thinking],
        ["Max tokens", config.max_tokens ?? "provider default"],
        ["Subagents", config.subagents_enabled ? "enabled" : "disabled"],
        ["Tool timeout", config.tool_timeout_secs ? `${config.tool_timeout_secs}s` : "disabled"],
        ["Favorites", config.favorite_count],
        ["Mini App", config.server_enabled ? "enabled" : "disabled"],
        ["Server port", config.server_port],
      ];
      for (const [key, value] of entries) {
        const cell = element("div", "config-cell");
        cell.append(element("div", "config-key", key), element("div", "config-value", String(value)));
        cell.title = String(value);
        grid.append(cell);
      }
      panel.append(grid);

      const helpers = element("div", "helper-list");
      for (const helper of config.helper_models) {
        helpers.append(listRow({ tone: "", title: helper.role, detail: helper.model, meta: "helper" }));
      }
      panel.append(helpers);
      wrapper.append(panel);
      return wrapper;
    }

    function renderAutomations(data) {
      const wrapper = section("07 / Schedule", "Automations", `${data.automations.length} defined`);
      if (!data.automations.length) {
        wrapper.append(emptyPanel("NO AUTOMATIONS DEFINED"));
        return wrapper;
      }
      const panel = element("div", "panel");
      for (const automation of data.automations) {
        panel.append(listRow({
          tone: automation.schedule ? "running" : "",
          title: automation.name,
          detail: automation.schedule || "manual only",
          meta: automation.schedule ? "scheduled" : "manual",
        }));
      }
      wrapper.append(panel);
      return wrapper;
    }

    function render(data) {
      const stopped = data.services.filter(service => !service.running);
      const systemCard = document.getElementById("systemCard");
      systemCard.classList.toggle("attention", stopped.length > 0);
      document.getElementById("systemTitle").textContent = stopped.length
        ? `${stopped.length} service${stopped.length === 1 ? "" : "s"} offline`
        : "All managed services online";
      document.getElementById("updatedAt").textContent = `SYNC ${new Date(data.generated_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      renderMetrics(data);
      content.replaceChildren(
        renderServices(data),
        renderAgents(data),
        renderBackground(data),
        renderSubscriptions(data),
        renderUsage(data),
        renderConfig(data),
        renderAutomations(data),
      );
    }

    function showError(message) {
      const panel = element("div", "error-panel");
      panel.append(element("h2", "", "Monitor unavailable"), element("p", "", message));
      content.replaceChildren(panel);
      document.getElementById("systemTitle").textContent = "Could not read local state";
      document.getElementById("systemCard").classList.add("attention");
    }

    async function telegramFetch(url) {
      const initData = tg?.initData;
      if (!initData) throw new Error("Open Monitor from the ZDX Telegram Mini App.");
      const response = await fetch(url, { headers: { Authorization: `tma ${initData}` } });
      if (response.status === 401 || response.status === 403) {
        throw new Error("Telegram authorization expired. Close and reopen the Mini App.");
      }
      if (!response.ok) throw new Error("The monitor snapshot could not be loaded.");
      return response.json();
    }

    async function loadMonitor() {
      refreshButton.classList.add("loading");
      refreshButton.disabled = true;
      tg?.HapticFeedback?.impactOccurred?.("light");
      try {
        const data = await telegramFetch(`/api/monitor?t=${Date.now()}`);
        render(data);
        lastLoadedAt = Date.now();
      } catch (error) {
        showError(error instanceof Error ? error.message : "Unknown error.");
      } finally {
        refreshButton.classList.remove("loading");
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadMonitor);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Date.now() - lastLoadedAt > 30000) loadMonitor();
    });
    setInterval(() => {
      if (!document.hidden) loadMonitor();
    }, 30000);
    loadMonitor();
  </script>
</body>
</html>
