# ZDX Configuration
#
# This file is auto-generated. Edit as needed.
# Documentation: https://github.com/tallesborges/zdx#configuration

# The Claude model to use
model = "claude-haiku-5-5"

# Maximum tokens for responses (optional)
# When unset, providers that support it omit the token limit and use provider defaults.
# Providers that require a limit use an internal fallback derived from model metadata.
# max_tokens = 12288

# Thinking level is part of the model spec: append `@<level>` to any model
# string, e.g. model = "provider:id@high".
# Options: off, low, medium, high, xhigh, max
# Note: when max_tokens is set, it is auto-adjusted to ensure room for both thinking and response.
handoff_model = "gemini:gemini-3.8-flash"
title_model = "gemini:gemini-3.5-flash-lite"
read_thread_model = "gemini:gemini-3.5-flash-lite"
tldr_model = "gemini:gemini-3.5-flash-lite"
prompt_builder_model = "openai:gpt-5.6-terra@low"
bash_foreground_bound_secs = 120

# Seconds a model request may go without content progress (keepalive pings do
# not count) before it fails as stalled and follows the normal retry rules.
# 0 disables the limit.
stream_idle_timeout_secs = 300

# System prompt (inline)
# system_prompt = "You are a helpful coding assistant."

# System prompt from file (takes precedence over inline)
# system_prompt_file = "/path/to/system_prompt.md"

# Optional custom system prompt template file.
# zdx always renders a MiniJinja system prompt template.
# If this file is unset (default), zdx uses the built-in system prompt template.
# MiniJinja syntax supported: {{ var }}, {% if %}, {% for %}
# Useful vars: is_openai_codex, base_prompt, project_context,
# skills_list, subagents_config, cwd, date
[prompt_template]
# file = "prompts/system_prompt_template.md"

# Memory system configuration
# Root directory for memory storage.
# ZDX derives NotePlan-style `Notes/`, `Calendar/`, and `Notes/MEMORY.md` paths under this root.
# Use an absolute path or `~/...`.
[memory]
# root = "~/Notes"  # default: $ZDX_HOME/memory

# Opt-in hosted embeddings for native memory vector/hybrid search.
# Configuring this section approves uploading the allowlisted sources (and
# vector/hybrid query text) to the provider. All fields below are required
# except base_url/dimensions; incomplete profiles fail clearly and keyword
# search stays fully local.
# [memory.embeddings]
# provider = "openai"                # provider id (resolves API key env + endpoint)
# model = "text-embedding-3-small"
# sources = ["note", "calendar"]     # allowlist: thread, note, calendar
# usd_per_million_tokens = 0.02      # pricing source for cost estimates
# max_run_tokens = 2000000           # hard per-run token budget
# base_url = "https://api.openai.com/v1"  # optional endpoint override
# dimensions = 1536                  # optional output dimension override

# Shared audio transcription configuration
# Used by TUI/CLI voice transcription and as the default for integrations.
# model: provider:model id (e.g. "elevenlabs:scribe_v2", "mistral:voxtral-mini-latest")
#        or a bare provider name ("openai", "mistral", "xai", "elevenlabs") for its default model.
#        Omit to auto-detect from available API keys (OpenAI, then Mistral, xAI, ElevenLabs).
# language: Optional language hint (ISO 639-1 code like "en", "pt", "es") for better accuracy
[transcription]
# model = "elevenlabs:scribe_v2"
# language = "en"

# Shared text-to-speech configuration
# Used by the `zdx speak` CLI and bot audio replies.
# model: provider:model id (e.g. "mistral:voxtral-mini-tts-latest", "openai:gpt-4o-mini-tts")
#        or a bare provider name ("openai", "mistral", "gemini", "xai") for its default model.
# voice: Voice to use (provider-specific, e.g. "en_paul_neutral" for Mistral, "coral" for OpenAI)
# format: Output audio format (e.g. "ogg" for a Telegram voice note, "mp3"; defaults to "ogg")
[speech]
# model = "mistral:voxtral-mini-tts-latest"
# voice = "en_paul_neutral"
# format = "ogg"

# Named model tiers, referenced everywhere as `mode:<name>`.
# Cycled with Tab in the TUI, listed by the Telegram launcher, rendered into the
# system prompt, and usable in `[subagents.overrides]`. Thinking rides in the
# `@<level>` suffix of `primary`; `alternatives` are equivalent picks at the same
# tier and are never selected automatically.
#
# [[model_modes]]
# name = "fast"
# description = "quick searches, cheap checks, exploration"
# primary = "provider:small-model@low"
# alternatives = ["provider:other-small-model@low"]

# Subagent delegation configuration
# enabled: Expose invoke_subagent tool to the model.
# overrides: Per-subagent model, either a spec or a `mode:<name>` reference,
#   e.g. explorer = { model = "mode:fast" }
[subagents]
enabled = true

# Model used for handoff generation subagent.
# Examples: "gemini:gemini-3-flash-preview", "openai:gpt-5.2"
# handoff_model = "gemini:gemini-3-flash-preview"

# Model used for auto-title generation subagent.
# Examples: "gemini:gemini-3.1-flash-lite-preview", "openai:gpt-5.2"
# title_model = "gemini:gemini-3.1-flash-lite-preview"

# Skill discovery configuration
# Enable/disable skill sources (all enabled by default)
[skills]
skill_repositories = ["openai/skills/skills/.curated", "openai/skills/skills/.system", "anthropics/skills/skills"]
enabled = true
[skills.sources]
zdx_user = true
zdx_project = true
codex_user = true
claude_user = true
claude_project = true
agents_user = true
agents_project = true

[providers.deepseek]
enabled = true
models = ["deepseek-flash"]
websocket = false
# GitHub repositories containing skills (owner/repo/path)
# ignored_skills = ["test-*", "wip-*"]
# include_skills = ["deploy-*", "release-*"]

# Telegram bot configuration
# The bot uses the layered `model` resolved from the chat's
# working directory (profile cwd, else the bot's own cwd).
[telegram]
# bot_token = "123456789:abcDEF..."
# allowlist_user_ids = [123456789]
# bot_token can also be set via ZDX_TELEGRAM_BOT_TOKEN
#
# [telegram.server]
# enabled = false
# port = 4141
# mini_app_url = "https://t.me/your_bot/threads"

# Shared reasoning effort used across providers.
# Options: low, medium, high, xhigh, max

# Provider configuration.
# api_key: Optional API key (overrides environment variable)
# base_url: Optional base URL (for proxies or test rigs)
# tools: Optional list of enabled tools. If set, overrides the default tool set.
#
# Available tools: bash, apply_patch, edit, fetch_webpage, invoke_subagent, read, read_thread, thread_search, web_search, write
# Default tool sets:
#   - default:       ["bash", "edit", "fetch_webpage", "invoke_subagent", "read", "read_thread", "thread_search", "web_search", "write"]
#   - openai_codex:  ["bash", "apply_patch", "fetch_webpage", "invoke_subagent", "read", "read_thread", "thread_search", "web_search"]
#
# [providers.<name>.audio] / [providers.custom.<name>.audio]: how ask_media sends audio
# to that provider over chat completions. Shipped defaults for built-in providers live in
# the embedded audio_providers.toml; each field you set replaces that one default.
# A custom provider has no defaults and needs payload and formats.
#   payload: "data-uri" | "data-uri-with-format" | "base64-with-format" | "base64"
#   formats: formats sent without conversion (must include "wav"; others become WAV)
#   max_base64_bytes: provider size limit for the encoded audio
#   max_tokens: max_tokens sent with the request
#   text_modalities: send modalities = ["text"]
# Which models take audio is set per model with input_audio in model_overrides.toml.

[providers.anthropic]
enabled = true
# api_key = "sk-ant-..."  # Overrides ANTHROPIC_API_KEY env var
# base_url = "https://api.anthropic.com"
models = ["claude-fable-5-1", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
websocket = false

