# Post-fetch overrides for `zdx models update`. Applied after models.dev/OpenRouter
# and win over fetched values. Matched by exact `id`; only the fields set here are
# overridden. Keep small and add a source + date — a pin can hide a real price change.
# Exception: the audio entries at the end are read at runtime by `ask_media`, not by
# the updater (see that section).

# MiMo V2.6 series (released 2026-09-21): not yet in models.dev, whose `xiaomi`
# provider still stops at V2.5. Values are the official overseas real-time API
# rates and the documented 1M context / 128K output limits. The full V2.6 series
# is natively omni-modal, so input_images is true for each (V2.5-Pro was text-only).
# https://mimo.mi.com/docs/price/pay-as-you-go
# https://mimo.mi.com/docs/quick-start/summary/model — verified 2026-09-22
[[override]]
id = "xiaomi:mimo-v2.6-pro"
input = 0.435
output = 0.87
cache_read = 0.0036
cache_write = 0.0
context_limit = 1048576
output_limit = 131072
reasoning = true
input_images = true

[[override]]
id = "xiaomi:mimo-v2.6-pro-ultraspeed"
input = 4.35
output = 8.7
cache_read = 0.036
cache_write = 0.0
context_limit = 1048576
output_limit = 131072
reasoning = true
input_images = true

[[override]]
id = "xiaomi:mimo-v2.6-flash"
input = 0.14
output = 0.28
cache_read = 0.0028
cache_write = 0.0
context_limit = 1048576
output_limit = 131072
reasoning = true
input_images = true

# Token Plan is a fixed-fee subscription, so pricing is zeroed by the updater.
# Only the capability/limit metadata needs pinning here.
[[override]]
id = "xiaomi-plan:mimo-v2.6-pro"
context_limit = 1048576
output_limit = 131072
reasoning = true
input_images = true

[[override]]
id = "xiaomi-plan:mimo-v2.6-flash"
context_limit = 1048576
output_limit = 131072
reasoning = true
input_images = true

# MiniMax-M3 standard tier (≤512K input) with the permanent 50% discount in effect.
# >512K long-context is double; ZDX uses a single rate, so we pin the ≤512K tier.
# https://platform.minimax.io/docs/guides/pricing-paygo — verified 2026-06-08
[[override]]
id = "minimax:MiniMax-M3"
input = 0.3
output = 1.2
cache_read = 0.06
cache_write = 0.0
context_limit = 1000000

# OpenRouter is authoritative for openrouter:* ids; models.dev serves a stale $1.75 output.
# https://openrouter.ai/z-ai/glm-4.7 — verified 2026-06-08
[[override]]
id = "openrouter:z-ai/glm-4.7"
output = 1.5

# GLM-5.3-Flash: models.dev serves the 50% launch promo (ends 2026-09-09, UTC+8).
# Pinned to list price. https://docs.z.ai/guides/overview/pricing — verified 2026-08-28
[[override]]
id = "zai:glm-5.3-flash"
input = 0.15
output = 0.5
cache_read = 0.03
cache_write = 0.0

# DeepSeek-V4.1-Flash (`deepseek-flash`, released 2026-09-10): too new for models.dev.
# Peak (standard) rates pinned; off-peak is 50% of these. Native vision + thinking mode.
# https://api-docs.deepseek.com/quick_start/pricing/ — verified 2026-09-11
[[override]]
id = "deepseek:deepseek-flash"
input = 0.3
output = 1.2
cache_read = 0.006
cache_write = 0.0
context_limit = 1000000
output_limit = 384000
reasoning = true
input_images = true

# Antigravity fixed-tier models bake the reasoning effort into the model id
# (-low/-medium/-high), so a separate user-selectable thinking level is redundant
# and misleading in the UI. Flag them non-reasoning to hide the thinking picker/
# indicator. The live catalog reports supportsThinking=true for every suffixed
# id, but the tier is already fixed by the id the user picked.
[[override]]
id = "google-antigravity:gemini-3.8-flash-high"
reasoning = false

[[override]]
id = "google-antigravity:gemini-3.8-flash-medium"
reasoning = false

[[override]]
id = "google-antigravity:gemini-3.8-flash-low"
reasoning = false

[[override]]
id = "google-antigravity:gemini-3.1-pro-low"
reasoning = false

# Gemini 4 Argon tiers on Antigravity. Unlike 3.8 Flash, the request's
# thinkingLevel is sent from the tier suffix (the backend honors the request
# level over the tier), so the id fixes the effort. Limits and image support
# from the live fetchAvailableModels catalog (CLI client). Verified: 2026-10-18.
[[override]]
id = "google-antigravity:gemini-4-argon-high"
reasoning = false
input_images = true
context_limit = 1048576
output_limit = 65536

[[override]]
id = "google-antigravity:gemini-4-argon-medium"
reasoning = false
input_images = true
context_limit = 1048576
output_limit = 65536

[[override]]
id = "google-antigravity:gemini-4-argon-low"
reasoning = false
input_images = true
context_limit = 1048576
output_limit = 65536

# Gemini 4 Argon (`gemini-4-argon`, Gemini API GA 2026-10-13): pinned to the current
# introductory rate, valid through 2026-11-30. Cached input is 95% off input.
# EXPIRES: from 2026-12-01 the standard rate is $4 input / $20 output ($0.20 cached);
# update this pin then. Context/output pass through (1048576 / 32768, matching the
# live models.get metadata for generateContent).
# https://aistudio.google.com/learn/gemini-4-argon-developer-guide — verified 2026-10-13
[[override]]
id = "gemini:gemini-4-argon"
input = 2.0
output = 10.0
cache_read = 0.1
cache_write = 0.0

# GPT-6.1 Sol (released 2026-09-29): not yet in models.dev. The OpenRouter
# fallback omits cache writes and reports cached input as 0.0999..., so pin the
# official standard rates (prompts over 272K input tokens are billed higher;
# the registry stores the base tier only).
# https://developers.openai.com/api/docs/models/gpt-6.1-sol — verified 2026-09-29
[[override]]
id = "openai:gpt-6.1-sol"
input = 2.0
output = 10.0
cache_read = 0.1
cache_write = 2.5
context_limit = 1050000
output_limit = 128000
reasoning = true
input_images = true

# Muse Wonder (`muse-wonder-1.0`, released 2026-10-12): models.dev lists the model
# under `meta` but with no cost, which the updater turns into $0. Pin the official
# Model API rates. No long-context premium. Meta publishes no max output, so the
# models.dev 131072 passes through.
# https://dev.meta.ai/models/muse-wonder — verified 2026-10-12
[[override]]
id = "meta:muse-wonder-1.0"
input = 4.0
output = 20.0
cache_read = 0.2
cache_write = 0.0

# Muse Wonder Full (`muse-wonder-full-1.0`, released 2026-10-12): Muse Code
# subscription only (Power Usage / Maximum Usage), so pricing stays zeroed. Not in
# models.dev or OpenRouter, so pin the metadata: 1M context, reasoning up to `max`,
# and image input (verified live 2026-10-12 with a Power Usage key). Meta publishes
# no max output; 131072 mirrors `muse-wonder-1.0`.
# https://dev.meta.ai/models/muse-wonder, https://dev.meta.ai/docs/models — verified 2026-10-12
[[override]]
id = "muse-code:muse-wonder-full-1.0"
context_limit = 1048576
output_limit = 131072
reasoning = true
input_images = true

# Audio input for `ask_media` (`input_audio`, optional `audio_formats`).
# These fields are read at call time from this file and then
# `$ZDX_HOME/model_overrides.toml`; `zdx models update` never writes them to
# `models.toml`, so regeneration cannot drop them. Add a model only when its
# provider documents audio input on Chat Completions and a synthetic clip
# works; the provider must have audio settings (an entry in audio_providers.toml,
# or a `[providers.custom.<name>.audio]` block for custom providers).
# Not listed: `mistral:voxtral-mini-latest` (400 `Invalid model` on chat) and
# `meta:muse-spark-1.3` (Meta documents degraded audio quality).
# Sources, verified 2026-10-28 with a synthetic clip:
# https://mimo.mi.com/docs/en-US/usage-guide/multimodal-understanding/audio-understanding
# https://docs.modelstudio.console.alibabacloud.com/en/model-studio/qwen-omni
# https://platform.stepfun.ai/docs/en/guides/models/stepaudio-2.5-chat
# https://dev.meta.ai/docs/video-understanding
# https://docs.mistral.ai/studio/audio/audio-in-chat
[[override]]
id = "xiaomi:mimo-v2.6-flash"
input_audio = true

[[override]]
id = "xiaomi:mimo-v2.6-pro"
input_audio = true

[[override]]
id = "xiaomi:mimo-v2.6-pro-ultraspeed"
input_audio = true

[[override]]
id = "alibaba:qwen3.8-omni-flash"
input_audio = true

[[override]]
id = "stepfun:stepaudio-2.5-chat"
input_audio = true

[[override]]
id = "meta:muse-wonder-1.0"
input_audio = true

[[override]]
id = "meta:muse-spark-1.2"
input_audio = true

[[override]]
id = "muse-code:muse-wonder-1.0"
input_audio = true

[[override]]
id = "muse-code:muse-wonder-full-1.0"
input_audio = true

[[override]]
id = "muse-code:muse-spark-1.2"
input_audio = true

[[override]]
id = "mistral:voxtral-small-latest"
input_audio = true
