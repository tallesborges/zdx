# Post-fetch overrides for `zdx models update`. Applied after models.dev/OpenRouter
# and win over fetched values. Matched by exact `id`; only the fields set here are
# overridden. Keep small and add a source + date — a pin can hide a real price change.

# MiMo V2.5 permanent price cut (2026-05-27); models.dev still serves old tiered pricing.
# https://platform.xiaomimimo.com/docs/en-US/news/v2.5-price-update — verified 2026-06-08
[[override]]
id = "xiaomi:mimo-v2.5-pro"
input = 0.435
output = 0.87
cache_read = 0.0036

[[override]]
id = "xiaomi:mimo-v2.5"
input = 0.14
output = 0.28
cache_read = 0.0028

# MiniMax-M3 standard tier (≤512K input) with the permanent 50% discount in effect.
# >512K long-context is double; ZDX uses a single rate, so we pin the ≤512K tier.
# https://platform.minimax.io/docs/guides/pricing-paygo — verified 2026-06-08
[[override]]
id = "minimax:MiniMax-M3"
input = 0.3
output = 1.2
cache_read = 0.06
cache_write = 0.0
context_limit = 1000000

# OpenRouter is authoritative for openrouter:* ids; models.dev serves a stale $1.75 output.
# https://openrouter.ai/z-ai/glm-4.7 — verified 2026-06-08
[[override]]
id = "openrouter:z-ai/glm-4.7"
output = 1.5

# Claude Sonnet 5 — models.dev reports introductory pricing ($2/$10) and wrong output_limit (128K).
# Standard pricing from Sep 1, 2026; output_limit sourced from Anthropic docs.
# https://platform.claude.com/docs/en/about-claude/pricing — verified 2026-07-07
[[override]]
id = "claude-sonnet-5"
input = 3.0
output = 15.0
output_limit = 64000

# Claude Sonnet 5 (claude-cli) — same wrong output_limit from models.dev.
[[override]]
id = "claude-cli:claude-sonnet-5"
output_limit = 64000

# qwen3.7-flash: released ~2026-07-15 and NOT yet in models.dev or Alibaba's public
# pricing page (its "Qwen-Flash" alias still maps to qwen3.5-flash; qwen3.6-flash is
# the newest priced flash). Values below are a PROXY from qwen3.6-flash pending official
# qwen3.7-flash pricing. https://www.alibabacloud.com/help/en/model-studio/model-pricing
# Flash tier = 1M context, thinking-capable. Re-verify when Alibaba publishes 3.7-flash.
[[override]]
id = "alibaba:qwen3.7-flash"
input = 0.19
output = 1.13
cache_read = 0.038
context_limit = 1000000
output_limit = 65536
reasoning = true
input_images = false

# GLM-5.3-Flash: models.dev serves the 50% launch promo (ends 2026-09-09, UTC+8).
# Pinned to list price. https://docs.z.ai/guides/overview/pricing — verified 2026-08-28
[[override]]
id = "zai:glm-5.3-flash"
input = 0.15
output = 0.5
cache_read = 0.03
cache_write = 0.0

# Muse Spark 1.3 (released 2026-09-02) is not in models.dev's `meta` provider yet, so the
# native meta: entries fall back to OpenRouter, whose max_completion_tokens (943718) is an
# OpenRouter routing cap, not Meta's API cap — OpenRouter reports the same 943718 for
# muse-spark-1.1, which models.dev's meta provider caps at 32000. output_limit below is a
# PROXY from the muse-spark-1.2 sibling (models.dev meta: 131072), corroborated by
# opencode-go's muse-spark-1.3-contributor entry. Pricing/context are left to upstream.
# https://models.dev/api.json (provider `meta`) — verified 2026-09-02. Drop these once
# models.dev publishes muse-spark-1.3.
[[override]]
id = "meta:muse-spark-1.3"
output_limit = 131072

[[override]]
id = "meta:muse-spark-1.3-contributor"
output_limit = 131072

# GPT-6 Astra (released 2026-09-03) is not in models.dev yet, so both entries below are
# built from the OpenRouter fallback. OpenRouter currently agrees with the official docs
# (1.05M context, 128K output, $10/$50), but it also served muse-spark routing caps as real
# limits, so the load-bearing fields are pinned rather than trusted.
# Note: prompts over 272K input tokens bill at 2x input/cache and 1.5x output for the whole
# request; ZDX uses a single flat rate, so the openai: entry under-reports past 272K.
# https://developers.openai.com/api/docs/models/gpt-6-astra — verified 2026-09-04.
# Drop these once models.dev publishes gpt-6-astra.
[[override]]
id = "openai:gpt-6-astra"
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.5
context_limit = 1050000
output_limit = 128000
reasoning = true
input_images = true

# Codex (ChatGPT subscription) serves the same model; usage is subscription-metered, so
# pricing is zeroed by ProviderKind::is_subscription() and deliberately not pinned here.
# Note the id is prefixed, unlike the other openai-codex entries: models.dev has no
# gpt-6-astra, so this record is built by the OpenRouter fallback, which prefixes ids.
[[override]]
id = "openai-codex:gpt-6-astra"
context_limit = 1050000
output_limit = 128000
reasoning = true
input_images = true

# Antigravity fixed-tier models bake the reasoning effort into the model id
# (-low/-medium/-high), so a separate user-selectable thinking level is redundant
# and misleading in the UI. Flag them non-reasoning to hide the thinking picker/
# indicator. The `-tiered` variant keeps reasoning=true (effort via thinking_level).
# 3.8 follows the same rule: the live catalog reports supportsThinking=true for
# every suffixed id, but the tier is already fixed by the id the user picked.
[[override]]
id = "google-antigravity:gemini-3.8-flash-high"
reasoning = false

[[override]]
id = "google-antigravity:gemini-3.8-flash-medium"
reasoning = false

