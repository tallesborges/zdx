[package]
name = "axum-golden"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "=0.8.9"
tower-http = { version = "=0.6.11", features = ["compression-gzip"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

[workspace]
